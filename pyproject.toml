[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crossguard-fi"
version = "0.2.0"
description = "Research-grade Wi-Fi CSI classification engineering reference: validation, subject-disjoint training, and secure inference"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary — see repository LICENSE_POLICY.md"}
authors = [{name = "Pavankumar Chandankar"}]
dependencies = [
  "numpy>=1.26,<3", "torch>=2.2,<3", "pydantic>=2.6,<3",
  "fastapi>=0.110,<1", "uvicorn>=0.27,<1"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.8,<1"]

[project.scripts]
crossguard = "crossguard_fi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
