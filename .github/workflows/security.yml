name: Minimal dependency and secret hygiene
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependency metadata (does not replace a vulnerability audit)
        run: |
          python -m pip install 'pip-audit>=2.7,<3'
          python -m pip_audit -r requirements-runtime.txt
